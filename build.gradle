plugins {
    id "com.gradleup.shadow" version "9.3.1"
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

base {
    archivesName = project.archives_base_name
}

version = project.minecraft_version + "-Fabric-" + project.mod_version
group = project.maven_group
var realVersion = project.mod_version + '+fabric'

repositories {
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.Snownee"
        }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

sourceSets {
    main.resources.srcDirs += "$rootDir/src/generated/resources"
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
    mixin {
        defaultRefmapName = "${project.mod_id}.refmap.json"
    }
    runs {
        //
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
        //
        datagenClient {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"

            runDir "build/datagen"
        }
    }
}

configurations {
    shadowCommon
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

//    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly("com.google.errorprone:error_prone_annotations:2.18.0")

    implementation shadowCommon("org.yaml:snakeyaml:${project.snakeyaml_version}")
    implementation shadowCommon("com.ezylang:EvalEx:${project.evalex_version}")
    implementation shadowCommon(project(':annotation')) {
        transitive(false)
    }
    implementation shadowCommon(project(':annotation-processor')) {
        transitive(false)
    }
    annotationProcessor project(':annotation-processor')

    implementation "com.google.code.findbugs:jsr305:3.0.2"

//    implementation "dev.architectury:architectury-fabric:${project.architectury_version}"
//    implementation "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:REIPluginCompatibilities-forge-annotations:12.+"

    implementation "maven.modrinth:jade:26.0.0+fabric"

//    // compile against the JEI API but do not include it at runtime
//    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
//    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
//    // at runtime, use the full JEI jar for Forge
//    implementation("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
//
//    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
//    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"
}

processResources {
    inputs.property "version", realVersion

    filesMatching("fabric.mod.json") {
        expand "version": realVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs.add("-Akiwi.clientOnlyMod")
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    it.exclude(["/assets/${project.mod_id}/blockstates",
                "/assets/${project.mod_id}/models",
                "/assets/${project.mod_id}/lang/en_us.existing.yaml",
                "/assets/kaleidos",
                "/snownee/${project.mod_id}/test",
                "/data",
                "/.cache",
                "/third_party"])
}

def excludes = ["/assets/${project.mod_id}/blockstates",
                "/assets/${project.mod_id}/models",
                "/assets/${project.mod_id}/lang/en_us.existing.yaml",
                "/assets/kaleidos",
                "/assets/kswitch",
                "/assets/test",
                "/snownee/${project.mod_id}/datagen/KiwiDataGen.class",
                "/snownee/${project.mod_id}/test",
                "/data",
                "/.cache",
                "/third_party"]

shadowJar {
    exclude(excludes)
    relocate "org.yaml.snakeyaml", "${project.group}.shadowed.org.yaml.snakeyaml"
    relocate "com.ezylang.evalex", "${project.group}.shadowed.com.ezylang.evalex"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set('shadow')
}

jar {
    dependsOn(shadowJar)
//    inputFile.set(shadowJar.archiveFile)
    archiveClassifier.set("")

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = switch (release_type) {
        case 'release' -> STABLE
        case 'beta' -> BETA
        case 'alpha' -> ALPHA
        default -> throw new GradleException("Unknown release type: $release_type")
    }
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "549404"
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        optional("cloth-config")
    }
    modrinth {
        projectId = "ufdDoWPd"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        optional("cloth-config")
    }
}