modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "kiwi"
version = "${file.jarVersion}"
displayName = "Kiwi Library"
authors = "Snownee"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/kiwi"
description = "Minecraft modding library"
logoFile = "assets/kiwi/logo.png"
credits = "3TUSK, SettingDust"

[[mixins]]
config = "kiwi.mixins.json"

[[dependencies.kiwi]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2.71,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.kiwi]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[modproperties.kiwi]
catalogueItemIcon = "minecraft:bookshelf" #Support for Catalogue mod

[modproperties.kiwi."fabric:entrypoints"]
fabric-datagen = ["snownee.kiwi.datagen.KiwiDataGen"]